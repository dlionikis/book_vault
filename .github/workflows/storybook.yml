name: Storybook CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      # Stories reach the Prisma client transitively (ContinueListening.stories
      # -> ContinueListening -> @/lib/db), and Prisma 7's client is gitignored
      # with no postinstall, so it must be generated before the build.
      - run: npm run db:generate
      - run: npm run build-storybook
