name: Main Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Type Check, and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: book_vault_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Must precede lint/type-check/test. Prisma 7 generates the client into
      # lib/generated/prisma (gitignored) and has no postinstall hook, so on a
      # fresh checkout nothing resolves `@/lib/generated/prisma/client` until
      # this runs. Under Prisma 6 the client landed in node_modules/.prisma
      # during `npm ci`, which is why this used to work further down the job.
      - name: Generate Prisma client
        run: npm run db:generate

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Setup test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/book_vault_test?schema=public

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/book_vault_test?schema=public
          NEXTAUTH_SECRET: test-secret

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the secret scan can diff against the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Fails on NEW high/critical advisories; the handful we have analyzed and
      # cannot fix from this repo are allowlisted by GHSA id in the script.
      # Previously `npm audit ... || true` via continue-on-error, which meant a
      # new critical CVE reported "pass" (audit finding S-4).
      - name: Check for new high/critical advisories
        run: npm run security:audit

      # Second line behind GitHub push protection, which only fires on push and
      # has no pattern for "a .env file with a real DATABASE_URL". Scans the PR's
      # own diff so a secret cannot arrive via a branch pushed with --no-verify.
      - name: Scan PR diff for committed secrets
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          ./scripts/check-staged-secrets.sh --range "origin/${{ github.base_ref }}...HEAD"
