name: iOS Tests

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint Swift code
        working-directory: ios
        run: swiftlint lint --config .swiftlint.yml --strict --reporter github-actions-logging
        continue-on-error: true

      - name: Verify Swift models exist
        run: |
          echo "=== Checking tracked Swift models ==="
          SWIFT_COUNT=$(find ios/BookVault/Generated/Models -name "*.swift" 2>/dev/null | wc -l | tr -d ' ')
          echo "Found $SWIFT_COUNT Swift files in Generated/Models/"
          if [ "$SWIFT_COUNT" -lt 10 ]; then
            echo "❌ Error: Expected generated Swift models to be tracked in git"
            echo "Run 'npm run api:generate:swift' locally and commit the generated files"
            exit 1
          fi
          ls -la ios/BookVault/Generated/Models/Book.swift ios/BookVault/Generated/Models/Models.swift

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: List available simulators
        run: |
          echo "=== Available Xcode versions ==="
          ls /Applications/ | grep Xcode
          echo ""
          echo "=== Current Xcode version ==="
          xcodebuild -version
          echo ""
          echo "=== Available iOS Simulators ==="
          xcrun simctl list devices available | grep -E "iPhone|iPad" | head -20

      - name: Find available simulator
        id: simulator
        run: |
          # Find the first available iPhone simulator using JSON output for reliability
          DEST=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data.get('devices', {}).items():
              if 'iOS' in runtime:
                  for d in devices:
                      if 'iPhone' in d['name'] and d['isAvailable']:
                          print(f\"platform=iOS Simulator,id={d['udid']}\")
                          sys.exit(0)
          print('platform=iOS Simulator,name=iPhone 16')
          ")
          echo "Using simulator: $DEST"
          echo "destination=$DEST" >> $GITHUB_OUTPUT

      - name: Run tests with coverage
        working-directory: ios
        run: |
          # Remove any existing result bundle
          rm -rf TestResults.xcresult

          # Run tests directly without xcpretty (avoids encoding issues)
          xcodebuild test \
            -scheme BookVault \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log

          # Check if tests passed by examining the log
          if grep -qF "** TEST SUCCEEDED **" xcodebuild.log; then
            echo "✅ Tests passed"
          else
            echo "❌ Tests failed"
            exit 1
          fi

      # UI tests run on a separate scheme so they stay out of validate:ios.
      # Non-blocking for now, matching how SwiftLint and the coverage threshold are
      # already treated here: an immediately-blocking flaky UI suite teaches people
      # to ignore CI. Promote to blocking once it has been reliably green.
      # Only the login flows run here — the rest need a backend with seeded data.
      # See docs/plans/ios-ui-testing-plan.md.
      - name: Run UI tests
        working-directory: ios
        continue-on-error: true
        run: |
          rm -rf UITestResults.xcresult

          xcodebuild test \
            -scheme BookVault-UITests \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -resultBundlePath UITestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-ui.log

          if grep -qF "** TEST SUCCEEDED **" xcodebuild-ui.log; then
            echo "✅ UI tests passed"
          else
            echo "⚠️ UI tests failed (non-blocking)"
            exit 1
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            ios/TestResults.xcresult
            ios/xcodebuild.log
            ios/UITestResults.xcresult
            ios/xcodebuild-ui.log

      - name: Generate coverage report
        if: success()
        working-directory: ios
        run: |
          echo "## Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check if result bundle exists and has coverage data
          if [ -d "TestResults.xcresult" ]; then
            echo "Result bundle found, attempting to extract coverage..."

            # Try to generate coverage report (may fail if no coverage data)
            if xcrun xccov view --report --json TestResults.xcresult > coverage.json 2>/dev/null; then
              echo '```' >> $GITHUB_STEP_SUMMARY
              xcrun xccov view --report TestResults.xcresult 2>/dev/null | head -30 >> $GITHUB_STEP_SUMMARY || echo "Coverage data not available" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ Coverage report generation failed - this is non-blocking" >> $GITHUB_STEP_SUMMARY
              echo '{}' > coverage.json
            fi
          else
            echo "⚠️ Result bundle not found" >> $GITHUB_STEP_SUMMARY
            echo '{}' > coverage.json
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coverage-report
          path: ios/coverage.json

      - name: Check coverage threshold
        if: success()
        continue-on-error: true
        working-directory: ios
        run: |
          if [ -d "TestResults.xcresult" ]; then
            COVERAGE=$(xcrun xccov view --report TestResults.xcresult 2>/dev/null | grep 'BookVault.app' | awk '{print $2}' | tr -d '%' || echo "")
            if [ -n "$COVERAGE" ]; then
              echo "Coverage: $COVERAGE%"
              if (( $(echo "$COVERAGE < 70" | bc -l) )); then
                echo "::warning::Coverage ($COVERAGE%) is below 70% target"
              else
                echo "✅ Coverage ($COVERAGE%) meets 70% target"
              fi
            else
              echo "::notice::Could not parse coverage percentage - tests passed but coverage unavailable"
            fi
          else
            echo "::notice::Coverage check skipped - result bundle not available"
          fi
