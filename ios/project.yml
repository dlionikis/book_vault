name: BookVault
options:
  bundleIdPrefix: com.bookvault
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

fileGroups:
  - Config

settings:
  base:
    MARKETING_VERSION: '1.1'
    CURRENT_PROJECT_VERSION: '2'
    # Xcode Recommendations
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
    ENABLE_LOCALIZATION_STRING_GENERATION: YES

targets:
  BookVault:
    type: application
    platform: iOS
    deploymentTarget: '17.0'

    info:
      path: BookVault/Info.plist
      properties:
        APIBaseURL: $(API_BASE_URL)
        # Two scenes: the SwiftUI phone window and the CarPlay template scene.
        #
        # `UIApplicationSupportsMultipleScenes` MUST be true for CarPlay — the
        # CarPlay scene is a second, concurrently-connected scene. This also
        # changes UIKit lifecycle behavior for the phone app, which is why this
        # change ships with a phone regression pass (`npm run ios:test:ui`).
        #
        # The window-scene configuration deliberately declares NO
        # `UISceneDelegateClassName`. SwiftUI's `App` lifecycle installs its own
        # scene delegate; naming one here (or omitting the configuration
        # entirely once a manifest exists) is the classic way to make the phone
        # app launch to a black screen.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay Configuration
                UISceneClassName: CPTemplateApplicationScene
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
          - remote-notification
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSFaceIDUsageDescription: Book Vault uses Face ID to securely log you in without entering your password.

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bookvault.BookVault
        # Push notifications (Phase 7b). Use the committed entitlements file
        # rather than xcodegen's `entitlements:` (which would regenerate/overwrite
        # it). aps-environment=development for Debug; automatic signing rewrites
        # it to production at archive time.
        CODE_SIGN_ENTITLEMENTS: BookVault/BookVault.entitlements
        # iPhone only. iPad was previously declared here but the app has no
        # adaptive layout (no NavigationSplitView / size-class handling), so it
        # shipped as a stretched-phone experience. Re-add '2' only alongside a
        # real iPad design. Orientation support is unchanged (iPhone landscape
        # is still supported).
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: '6.0'
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # Xcode Recommendations (also set at project level)
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
        ENABLE_LOCALIZATION_STRING_GENERATION: YES

    sources:
      # Main source files
      - path: BookVault
        excludes:
          - 'Generated/**'
          - '**/*.md'
          - 'Preview Content/**'
        createIntermediateGroups: true

      # Generated OpenAPI models (exclude Package.swift and config files)
      - path: BookVault/Generated/Models
        excludes:
          - 'Package.swift'
          - 'project.yml'
          - '*.md'
          - '*.sh'
          - '*.podspec'
          - 'Cartfile'
          - '.openapi-generator/**'
          - '.openapi-generator-ignore'
          - '.swiftformat'
        type: group
        createIntermediateGroups: false

      # Resources
      - path: BookVault/Preview Content
        buildPhase: resources

    # Dependencies would go here if needed
    # dependencies:
    #   - target: SomeFramework

  BookVaultTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bookvault.BookVaultTests
        # Match the host app (iPhone only); xcodegen otherwise defaults to '1,2'.
        TARGETED_DEVICE_FAMILY: '1'
        # Keep the test target in the same language mode as the code it exercises.
        SWIFT_VERSION: '6.0'
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/BookVault.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BookVault'
        BUNDLE_LOADER: '$(TEST_HOST)'

    sources:
      - path: BookVaultTests
        createIntermediateGroups: true

    dependencies:
      - target: BookVault

  # XCUITest target. Deliberately NOT in the default BookVault scheme's `test:`
  # block: scripts/ios-validate.sh runs a bare `xcodebuild test -scheme BookVault`,
  # so adding it there would put slow UI tests in the fast inner loop. Driven by
  # the BookVault-UITests scheme instead. See docs/plans/ios-ui-testing-plan.md.
  BookVaultUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '17.0'

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bookvault.BookVaultUITests
        # Match the host app (iPhone only); xcodegen otherwise defaults to '1,2'.
        TARGETED_DEVICE_FAMILY: '1'
        # Keep in step with the app; moves with A4.
        SWIFT_VERSION: '6.0'
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BookVault

    sources:
      - path: BookVaultUITests
        createIntermediateGroups: true

    dependencies:
      - target: BookVault

schemes:
  BookVault:
    build:
      targets:
        BookVault: all
        BookVaultTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BookVaultTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Separate scheme so UI tests stay out of `validate:ios` / `validate:full`.
  # Run with: npm run ios:test:ui
  BookVault-UITests:
    build:
      targets:
        BookVault: all
        BookVaultUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BookVaultUITests
    analyze:
      config: Debug
    archive:
      config: Release

  BookVault-Production:
    build:
      targets:
        BookVault: all
    run:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
