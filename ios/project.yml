name: BookVault
options:
  bundleIdPrefix: com.bookvault
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'

targets:
  BookVault:
    type: application
    platform: iOS
    deploymentTarget: '17.0'

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bookvault.BookVault
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ''
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: '5.0'
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

    sources:
      # Main source files
      - path: BookVault
        excludes:
          - 'Generated/**'
          - '**/*.md'
          - 'Assets.xcassets'
          - 'Preview Content/**'
        createIntermediateGroups: true

      # Generated OpenAPI models (exclude Package.swift and config files)
      - path: BookVault/Generated/Models
        excludes:
          - 'Package.swift'
          - 'project.yml'
          - '*.md'
          - '.openapi-generator/**'
          - '.openapi-generator-ignore'
          - '.swiftformat'
        type: group
        createIntermediateGroups: false

    # Resources
    resources:
      - BookVault/Assets.xcassets
      - BookVault/Preview Content

    # Dependencies would go here if needed
    # dependencies:
    #   - target: SomeFramework

schemes:
  BookVault:
    build:
      targets:
        BookVault: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
