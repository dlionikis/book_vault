name: BookVault
options:
  bundleIdPrefix: com.bookvault
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    # Xcode Recommendations
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
    ENABLE_LOCALIZATION_STRING_GENERATION: YES

targets:
  BookVault:
    type: application
    platform: iOS
    deploymentTarget: '17.0'

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bookvault.BookVault
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        # Background Modes - Enable audio playback in background
        INFOPLIST_KEY_UIBackgroundModes: 'audio'
        # App Transport Security - Allow local HTTPS dev server with self-signed cert
        INFOPLIST_KEY_NSAppTransportSecurity: |
          <dict>
            <key>NSAllowsArbitraryLoads</key>
            <true/>
          </dict>
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: '5.0'
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # Xcode Recommendations (also set at project level)
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
        ENABLE_LOCALIZATION_STRING_GENERATION: YES

    sources:
      # Main source files
      - path: BookVault
        excludes:
          - 'Generated/**'
          - '**/*.md'
          - 'Assets.xcassets'
          - 'Preview Content/**'
        createIntermediateGroups: true

      # Generated OpenAPI models (exclude Package.swift and config files)
      - path: BookVault/Generated/Models
        excludes:
          - 'Package.swift'
          - 'project.yml'
          - '*.md'
          - '.openapi-generator/**'
          - '.openapi-generator-ignore'
          - '.swiftformat'
        type: group
        createIntermediateGroups: false

    # Resources
    resources:
      - BookVault/Assets.xcassets
      - BookVault/Preview Content

    # Dependencies would go here if needed
    # dependencies:
    #   - target: SomeFramework

  BookVaultTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bookvault.BookVaultTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/BookVault.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BookVault'
        BUNDLE_LOADER: '$(TEST_HOST)'

    sources:
      - path: BookVaultTests
        createIntermediateGroups: true

    dependencies:
      - target: BookVault

schemes:
  BookVault:
    build:
      targets:
        BookVault: all
        BookVaultTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BookVaultTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
