name: BookVault
options:
  bundleIdPrefix: com.bookvault
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

fileGroups:
  - Config

settings:
  base:
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    # Xcode Recommendations
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
    ENABLE_LOCALIZATION_STRING_GENERATION: YES

targets:
  BookVault:
    type: application
    platform: iOS
    deploymentTarget: '17.0'

    info:
      path: BookVault/Info.plist
      properties:
        APIBaseURL: $(API_BASE_URL)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSFaceIDUsageDescription: Book Vault uses Face ID to securely log you in without entering your password.

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bookvault.BookVault
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: '5.0'
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # Xcode Recommendations (also set at project level)
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
        ENABLE_LOCALIZATION_STRING_GENERATION: YES

    sources:
      # Main source files
      - path: BookVault
        excludes:
          - 'Generated/**'
          - '**/*.md'
          - 'Preview Content/**'
        createIntermediateGroups: true

      # Generated OpenAPI models (exclude Package.swift and config files)
      - path: BookVault/Generated/Models
        excludes:
          - 'Package.swift'
          - 'project.yml'
          - '*.md'
          - '.openapi-generator/**'
          - '.openapi-generator-ignore'
          - '.swiftformat'
        type: group
        createIntermediateGroups: false

      # Resources
      - path: BookVault/Preview Content
        buildPhase: resources

    # Dependencies would go here if needed
    # dependencies:
    #   - target: SomeFramework

  BookVaultTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bookvault.BookVaultTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/BookVault.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BookVault'
        BUNDLE_LOADER: '$(TEST_HOST)'

    sources:
      - path: BookVaultTests
        createIntermediateGroups: true

    dependencies:
      - target: BookVault

schemes:
  BookVault:
    build:
      targets:
        BookVault: all
        BookVaultTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BookVaultTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  BookVault-Production:
    build:
      targets:
        BookVault: all
    run:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
