  # Library endpoints
  /api/library:
    get:
      operationId: getLibrary
      tags: [Library]
      summary: Get user's library books
      responses:
        '200':
          description: User's library
          content:
            application/json:
              schema:
                type: object
                required: [books, total]
                properties:
                  books:
                    type: array
                    items:
                      $ref: '#/components/schemas/Book'
                  total:
                    type: integer
                    minimum: 0
                    example: 42
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      operationId: addToLibrary
      tags: [Library]
      summary: Add book to user's library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookId]
              properties:
                bookId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Book added to library
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: 'Book added to library'
        '200':
          description: Book already in library
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: 'Book already in library'
        '400':
          description: Missing book ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/library/{bookId}:
    delete:
      operationId: removeFromLibrary
      tags: [Library]
      summary: Remove book from user's library
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Book ID to remove
      responses:
        '200':
          description: Book removed from library
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: 'Book removed from library'
        '404':
          description: Library not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
