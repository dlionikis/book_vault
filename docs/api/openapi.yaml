  # Progress endpoints
  /api/progress/batch:
    post:
      operationId: batchUpdateProgress
      tags: [Progress]
      summary: Batch update user progress for offline sync
      description: |
        Accepts array of progress updates with timestamps for conflict resolution.
        Only updates if client timestamp is newer than server timestamp.

        **Supports both authentication methods**:
        - Session cookies (web)
        - Bearer token (mobile)
      security:
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updates]
              properties:
                updates:
                  type: array
                  items:
                    type: object
                    required: [bookId, positionSeconds, timestamp]
                    properties:
                      bookId:
                        type: string
                        format: uuid
                      positionSeconds:
                        type: number
                        format: double
                        minimum: 0
                      timestamp:
                        type: string
                        format: date-time
                        description: Client timestamp for conflict resolution
      responses:
        '200':
          description: Batch update results
          content:
            application/json:
              schema:
                type: object
                required: [updated, conflicts, details]
                properties:
                  updated:
                    type: integer
                    minimum: 0
                    example: 5
                    description: Number of successful updates
                  conflicts:
                    type: integer
                    minimum: 0
                    example: 1
                    description: Number of conflicts (server timestamp newer)
                  details:
                    type: array
                    items:
                      type: object
                      required: [bookId, status]
                      properties:
                        bookId:
                          type: string
                          format: uuid
                        status:
                          type: string
                          enum: [updated, conflict]
        '400':
          description: Invalid request (missing updates array)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

