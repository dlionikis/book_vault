          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/downloads/{bookId}:
    post:
      operationId: generateDownloadUrl
      tags: [Downloads]
      summary: Generate pre-signed download URL
      description: |
        Generates a pre-signed S3 URL for downloading audiobook file.
        URL expires in 1 hour. Rate limited to 10 downloads per day.

        **Requires S3 configuration** - returns 501 if S3 not enabled.
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Book ID to download
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                  description: Optional device identifier
      responses:
        '200':
          description: Download URL generated
          content:
            application/json:
              schema:
                type: object
                required: [downloadUrl, expiresAt, fileSize]
                properties:
                  downloadUrl:
                    type: string
                    format: uri
                    description: Pre-signed S3 URL (expires in 1 hour)
                  expiresAt:
                    type: string
                    format: date-time
                    description: URL expiration time
                  fileSize:
                    type: integer
                    minimum: 0
                    description: File size in bytes
        '400':
          description: Book has no audio file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Download limit exceeded (10/day)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Downloads require S3 configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/downloads/{bookId}/check:
    get:
      operationId: checkDownloadEligibility
      tags: [Downloads]
      summary: Check if user can download book
      description: |
        Verifies book exists and user is eligible to download.
        Currently returns true for all books (MVP).
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Book ID to check
      responses:
        '200':
          description: Eligibility check result
          content:
            application/json:
              schema:
                type: object
                required: [eligible]
                properties:
                  eligible:
                    type: boolean
                    example: true
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # User endpoints
  /api/user/password:
    put:
      operationId: updatePassword
      tags: [User]
      summary: Update user password
      description: |
        Validates current password and updates to new password.
        New password must be at least 8 characters.
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: 'Password updated successfully'
        '400':
          description: Invalid request (current password wrong or new password too short)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Media streaming endpoints
  /api/audio/{path}:
    get:
      operationId: streamAudio
      tags: [Media]
      summary: Stream audio file with range request support
      description: |
        Streams audiobook files from S3 (production) or local filesystem (development).
        Supports HTTP range requests for seeking during playback.
        Requires authentication.
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
          description: Audio file path (catch-all route)
          example: 'books/B002V5D1CG.m4b'
        - name: Range
          in: header
          schema:
            type: string
          description: HTTP range header for partial content requests
          example: 'bytes=0-1023'
      responses:
        '200':
          description: Audio file stream (full content)
          content:
            audio/mp4:
              schema:
                type: string
                format: binary
          headers:
            Content-Type:
              schema:
                type: string
                example: 'audio/mp4'
            Content-Length:
              schema:
                type: integer
            Cache-Control:
              schema:
                type: string
                example: 'public, max-age=31536000, immutable'
        '206':
          description: Partial audio content (range request)
          content:
            audio/mp4:
              schema:
                type: string
                format: binary
          headers:
            Content-Range:
              schema:
                type: string
                example: 'bytes 0-1023/1048576'
            Content-Type:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Audio file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/images/{path}:
    get:
      operationId: streamImage
      tags: [Media]
      summary: Stream image file (book covers)
      description: |
        Serves book cover images from S3 (production) or local filesystem (development).
        Public endpoint (no authentication required for better caching).
      security: [] # Public endpoint
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
          description: Image file path (catch-all route)
          example: 'covers/B002V5D1CG.jpg'
      responses:
        '200':
          description: Image file
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
          headers:
            Content-Type:
              schema:
                type: string
                example: 'image/jpeg'
            Content-Length:
              schema:
                type: integer
            Cache-Control:
              schema:
                type: string
                example: 'public, max-age=31536000, immutable'
        '404':
          description: Image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Health check
  /api/health:
    get:
      operationId: healthCheck
      tags: [Health]
      summary: API health check
      description: Returns 200 OK if server is running
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: 'ok'
