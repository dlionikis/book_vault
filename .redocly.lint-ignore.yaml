# Redocly lint ignore — surgical, single-line suppressions only.
# See https://redocly.com/docs/cli/ for more information.
#
# The one struct entry below is a known-good OpenAPI 3.0 nullable-$ref: the verify
# endpoint's `user` is `allOf: [$ref User]` + `nullable: true` (no `type`). redocly's
# struct rule wants a `type` alongside `nullable`, but adding `type: object` makes
# jest-openapi's RUNTIME validator reject the real `user: null` response and breaks
# the live contract test. The runtime contract test is the stricter, authoritative
# check, so we suppress only this one redocly complaint. See the matching comment in
# openapi.yaml. (operation-4xx-response and no-unused-components stay as warnings —
# not ignored — so they still surface.)
docs/api/openapi.yaml:
  struct:
    - >-
      #/paths/~1api~1auth~1mobile~1verify/get/responses/200/content/application~1json/schema/properties/user/nullable
