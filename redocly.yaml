# Redocly lint config for docs/api/openapi.yaml (npm run api:validate).
#
# Added when redocly/cli was bumped 1.25 → 1.34, whose stricter defaults flagged
# our intentional localhost dev-server URL. We keep the recommended ruleset and
# relax only the checks that don't fit a single-app, self-documented spec.
extends:
  - recommended
rules:
  # servers[].url intentionally lists http://localhost:3000 as the development
  # server (see the inline comment in openapi.yaml). The prod server is also listed.
  no-server-example.com: off
  no-server-trailing-slash: off
  # These schemas are referenced indirectly (composed into responses) or reserved
  # for future direct queries; they carry x-internal: true. Not worth failing lint.
  no-unused-components: warn
